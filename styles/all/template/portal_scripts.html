<!-- INCLUDEJS assets/portal.js -->
<!-- INCLUDEJS assets/scroller.js -->

<script>
var onload_functions = [];
var onunload_functions = [];

function run_portal_callbacks(callbacks)
{
	callbacks.forEach(function(callback)
	{
		if (typeof callback === 'function')
		{
			callback();
		}
	});
}

window.addEventListener('load', function() { run_portal_callbacks(onload_functions); });
window.addEventListener('unload', function() { run_portal_callbacks(onunload_functions); });
onload_functions.push(function()
{
	if (typeof init_scrollers === 'function')
	{
		init_scrollers();
	}
});
</script>

<link rel="shortcut icon" href="{ROOT_PATH}favicon.ico" />
<link rel="icon" href="{ROOT_PATH}favicon.ico" type="image/x-icon" />
