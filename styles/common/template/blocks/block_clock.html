<div class="block_data" style="text-align:center;">
	<time class="portal-clock" style="font-size:1.5em;" aria-live="off"></time>
</div>
<script>
(function() {
	var clock = document.currentScript.previousElementSibling.querySelector('.portal-clock');
	function updateClock() { clock.textContent = new Date().toLocaleTimeString(); }
	updateClock();
	window.setInterval(updateClock, 1000);
}());
</script>
<!-- IF DEBUG_QUERIES --><div class="block_data">{CLOCK_DEBUG}</div><!-- ENDIF -->
