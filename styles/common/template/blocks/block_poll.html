<div class="block_data portal-poll">
	<!-- IF BS_HAS_POLL -->
	<h4>{BPOLL_QUESTION}</h4>
	<!-- BEGIN b_poll_option -->
	<div class="portal-poll-option">
		<div>
			<span>{b_poll_option.POLL_OPTION_CAPTION}</span>
			<span style="float:{S_CONTENT_FLOW_END};">{b_poll_option.POLL_OPTION_RESULT} ({b_poll_option.POLL_OPTION_PERCENT})</span>
		</div>
		<progress value="{b_poll_option.POLL_OPTION_PCT}" max="100" style="width:100%;">{b_poll_option.POLL_OPTION_PERCENT}</progress>
	</div>
	<!-- END b_poll_option -->
	<p style="text-align:center;">
		<!-- IF BL_POLL_LENGTH -->{BL_POLL_LENGTH}<br /><!-- ENDIF -->
		{L_TOTAL_VOTES}: {BTOTAL_VOTES}<br />
		<a href="{BU_VIEW_RESULTS}">{L_VIEW_RESULTS}</a>
	</p>
	<!-- ELSE -->
	<p>{L_NONE}</p>
	<!-- ENDIF -->
</div>
